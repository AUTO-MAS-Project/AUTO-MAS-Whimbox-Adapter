name: 构建并发布 PyPI 包

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 构建与校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: 检查发布标签与包版本一致
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("发布标签必须与 pyproject.toml 的版本一致")
          PY
      - name: 安装构建工具
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: 构建 wheel 和源码包
        run: python -m build
      - name: 校验包元数据
        run: python -m twine check --strict dist/*
      - name: 校验分发包中的项目链接
        run: |
          python - <<'PY'
          from email import policy
          from email.parser import BytesParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from zipfile import ZipFile

          for path in Path("dist").glob("*.whl"):
              with ZipFile(path) as wheel:
                  name = next(item for item in wheel.namelist() if item.endswith(".dist-info/METADATA"))
                  metadata = BytesParser(policy=policy.default).parsebytes(wheel.read(name))
              for value in metadata.get_all("Project-URL", []):
                  label, url = str(value).split(",", 1)
                  parsed = urlsplit(url.strip())
                  if parsed.scheme not in {"http", "https"} or not parsed.netloc:
                      raise SystemExit(f"{label} 必须是有效的 HTTP/HTTPS 项目链接")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: 发布到 PyPI
    needs: build
    if: github.repository == 'AUTO-MAS-Project/AUTO-MAS-Whimbox-Adapter' && github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/auto-mas-whimbox-adapter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: 使用 Trusted Publishing 上传
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
