<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whimbox</title>
    <link rel="stylesheet" href="panel.css" />
    <script defer src="panel-sdk.js"></script>
    <script defer src="installation.js"></script>
    <script defer src="panel.js"></script>
  </head>
  <body>
    <fieldset id="controls" disabled>
      <legend data-text="installation"></legend>
      <label><span data-text="name"></span><input id="name" required /></label>
      <label
        ><span data-text="root"></span
        ><span class="picker"
          ><input id="root" /><button type="button" id="browse" data-text="browse"></button></span
      ></label>
      <output id="version"></output>
    </fieldset>
    <div id="status" role="alert"></div>
  </body>
</html>
