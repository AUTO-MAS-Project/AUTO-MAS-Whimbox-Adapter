<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Whimbox</title>
    <link rel="stylesheet" href="panel.css" />
    <script defer src="panel-sdk.js"></script>
    <script defer src="tasks.js"></script>
    <script defer src="panel.js"></script>
  </head>
  <body>
    <fieldset id="controls" disabled>
      <legend data-text="tasks"></legend>
      <div id="tags"></div>
      <label
        ><span data-text="accounts"></span><input id="accounts" type="checkbox" role="switch"
      /></label>
      <div id="columns">
        <section>
          <h3 data-text="steps"></h3>
          <div id="steps"></div>
        </section>
        <section>
          <h3 data-text="options"></h3>
          <div id="options"></div>
        </section>
      </div>
      <output id="version"></output>
    </fieldset>
    <div id="status" role="alert"></div>
  </body>
</html>
