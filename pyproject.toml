[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-mas-whimbox-adapter"
version = "0.1.2"
description = "Whimbox specialized script adapter for AUTO-MAS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "AUTO-MAS Team" }]
keywords = ["auto-mas-plugin", "auto-mas-id:whimbox_adapter"]
dependencies = ["auto-mas-core>=5.9.0b1,<6"]

[project.urls]
Changelog = "https://github.com/AUTO-MAS-Project/AUTO-MAS-Whimbox-Adapter/blob/master/CHANGELOG.md"
Documentation = "https://github.com/AUTO-MAS-Project/AUTO-MAS-Whimbox-Adapter/blob/master/README.md"
Homepage = "https://auto-mas.top"
Repository = "https://github.com/AUTO-MAS-Project/AUTO-MAS-Whimbox-Adapter"
Issues = "https://github.com/AUTO-MAS-Project/AUTO-MAS-Whimbox-Adapter/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
whimbox_adapter = ["py.typed"]

[tool.auto-mas]
bundled = true
default-enabled = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["whimbox_adapter"]
known-third-party = ["app", "auto_mas_core"]
